name: PublicVPNList legacy record discovery

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-legacy-record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect redacted legacy record
        shell: bash
        run: |
          set -eu
          python3 <<'PY'
          import json
          import urllib.request
          import urllib.parse

          params = {
              "country": "PH",
              "protocol": "openvpn",
              "status": "online",
              "per_page": "1",
              "sort": "last_checked",
              "order": "desc",
              "legacy": "1",
          }
          url = "https://publicvpnlist.com/api/v1/servers?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.load(response)
          print("top_keys=" + ",".join(sorted(payload)) if isinstance(payload, dict) else "top_type=" + type(payload).__name__)
          records = payload.get("items", []) if isinstance(payload, dict) else payload
          if not records or not isinstance(records[0], dict):
              print("records=0")
              raise SystemExit(0)
          record = records[0]
          print("record_keys=" + ",".join(sorted(record)))
          for key in sorted(record):
              value = record[key]
              lower = key.lower()
              if "url" in lower:
                  value = "<url-present>" if value else "<url-empty>"
              elif key in {"config_text", "token", "signature", "password", "secret"}:
                  value = "<redacted>"
              print(f"{key}={value!r}")
          PY
