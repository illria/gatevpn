name: PublicVPNList official client discovery

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/publicvpnlist-live-download
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official client route strings
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          request = urllib.request.Request(
              "https://publicvpnlist.com/local/templates/vpn/assets/app.js",
              headers={"Accept": "text/javascript, application/javascript"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              text = response.read(2 * 1024 * 1024).decode("utf-8", "replace")

          needles = (
              "test_server",
              "get_token",
              "download.php",
              "server/",
              "download/",
              "api/v1",
              "fetch(",
              "XMLHttpRequest",
              ".php",
          )
          matches = []
          for needle in needles:
              offset = 0
              while True:
                  index = text.lower().find(needle.lower(), offset)
                  if index < 0:
                      break
                  start = max(0, index - 260)
                  end = min(len(text), index + len(needle) + 420)
                  snippet = text[start:end].replace("\\n", " ")
                  matches.append({"needle": needle, "snippet": snippet})
                  offset = index + len(needle)
                  if len(matches) >= 120:
                      break
              if len(matches) >= 120:
                  break

          print(json.dumps({
              "bytes": len(text.encode("utf-8")),
              "matches": matches,
          }, ensure_ascii=False))
          PY
