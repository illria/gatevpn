name: PublicVPNList official client discovery

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/publicvpnlist-live-download
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official catalog JSON route
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          request = urllib.request.Request(
              "https://publicvpnlist.com/local/api/vpn-data.php",
              headers={
                  "Accept": "application/json",
                  "X-Requested-With": "XMLHttpRequest",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read(8 * 1024 * 1024).decode("utf-8"))

          rows = payload if isinstance(payload, list) else payload.get("data", [])
          print(json.dumps({
              "payload_type": type(payload).__name__,
              "rows": len(rows) if isinstance(rows, list) else 0,
              "keys": sorted(rows[0].keys()) if rows and isinstance(rows[0], dict) else [],
              "sample": [
                  {
                      key: row.get(key)
                      for key in ("id", "country", "countryName", "host", "ip", "port", "proto", "configAvailable", "downloadable")
                      if key in row
                  }
                  for row in rows[:3]
                  if isinstance(row, dict)
              ],
          }, ensure_ascii=False))
          PY
