name: PublicVPNList endpoint mapping probe

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare API and official export endpoints
        shell: bash
        run: |
          set -eu
          python3 <<'PY'
          import json
          import urllib.parse
          import urllib.request

          def get_json(url):
              req = urllib.request.Request(url, headers={"Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          api = []
          for country in ("PH", "FR", "US"):
              params = {
                  "country": country, "protocol": "openvpn", "status": "online",
                  "per_page": "200", "sort": "last_checked", "order": "desc",
              }
              payload = get_json("https://publicvpnlist.com/api/v1/servers?" + urllib.parse.urlencode(params))
              api.extend(payload.get("data", []) if isinstance(payload, dict) else payload)
          export = get_json("https://publicvpnlist.com/exports/openvpn-latest.json")
          records = export.get("records") or export.get("servers") or export.get("data") or []
          api_ips = {str(x.get("ip") or "").strip() for x in api if isinstance(x, dict) and x.get("ip")}
          export_ips = {str(x.get("ip") or "").strip() for x in records if isinstance(x, dict) and x.get("ip")}
          exact = 0
          ip_matches = 0
          api_sources = {}
          export_sources = {}
          for x in api:
              if not isinstance(x, dict):
                  continue
              source = str(x.get("source_name") or "")
              api_sources[source] = api_sources.get(source, 0) + 1
              if str(x.get("ip") or "").strip() in export_ips:
                  ip_matches += 1
              key = (
                  str(x.get("ip") or "").strip(),
                  str(x.get("port") or "").strip(),
                  str(x.get("transport") or "").strip().lower(),
              )
              for y in records:
                  if not isinstance(y, dict):
                      continue
                  ykey = (
                      str(y.get("ip") or "").strip(),
                      str(y.get("port") or "").strip(),
                      str(y.get("transport") or y.get("proto") or "").strip().lower(),
                  )
                  if key == ykey:
                      exact += 1
                      break
          for x in records:
              if isinstance(x, dict):
                  source = str(x.get("source_name") or "")
                  export_sources[source] = export_sources.get(source, 0) + 1
          print(json.dumps({
              "api_records": len(api),
              "export_records": len(records),
              "api_unique_ips": len(api_ips),
              "export_unique_ips": len(export_ips),
              "ip_intersection": len(api_ips & export_ips),
              "api_records_with_export_ip": ip_matches,
              "exact_endpoint_intersection": exact,
              "api_sources": api_sources,
              "export_sources": export_sources,
          }, sort_keys=True))
          PY
