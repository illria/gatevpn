name: PublicVPNList legacy compatibility probe

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe documented legacy query
        shell: bash
        run: |
          set -eu
          python3 <<'PY'
          import json
          import urllib.request
          import urllib.parse

          params = {
              "country": "PH",
              "protocol": "openvpn",
              "status": "online",
              "per_page": "1",
              "sort": "last_checked",
              "order": "desc",
              "legacy": "1",
          }
          url = "https://publicvpnlist.com/api/v1/servers?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.load(response)
          print("top_keys=" + ",".join(sorted(payload)) if isinstance(payload, dict) else "top_type=" + type(payload).__name__)
          records = payload.get("data", []) if isinstance(payload, dict) else payload
          if not records:
              print("records=0")
          else:
              print("record_keys=" + ",".join(sorted(records[0])))
              print(json.dumps({
                  key: records[0].get(key)
                  for key in ("id", "server_id", "download_page_url", "temporary_ovpn_url", "server_page_url", "config_download_url", "host", "ip", "port", "proto", "transport")
                  if key in records[0]
              }, sort_keys=True))
          PY
