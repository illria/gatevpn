name: PublicVPNList manifest discovery

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public manifest shape
        shell: bash
        run: |
          set -eu
          python3 <<'PY'
          import json
          import urllib.parse
          import urllib.request

          req = urllib.request.Request(
              "https://publicvpnlist.com/exports/openvpn-manifest.json",
              headers={"Accept": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.load(response)

          def safe(value):
              if isinstance(value, str):
                  parsed = urllib.parse.urlsplit(value)
                  if parsed.scheme and parsed.netloc:
                      return f"{parsed.scheme}://{parsed.netloc}{parsed.path} query={'yes' if parsed.query else 'no'}"
                  return value[:160]
              if isinstance(value, dict):
                  return {str(k): safe(v) for k, v in value.items() if "token" not in str(k).lower() and "secret" not in str(k).lower()}
              if isinstance(value, list):
                  return [safe(v) for v in value[:3]]
              return value

          print("top_type=" + type(payload).__name__)
          if isinstance(payload, dict):
              print("top_keys=" + ",".join(sorted(payload)))
              for key, value in payload.items():
                  if isinstance(value, dict):
                      print(f"{key}_keys=" + ",".join(sorted(str(k) for k in value)))
                  if isinstance(value, list):
                      print(f"{key}_length={len(value)}")
                  if key in {"data", "links", "exports", "files", "records", "servers"}:
                      print(f"{key}=" + json.dumps(safe(value), sort_keys=True))
          elif isinstance(payload, list) and payload:
              print("first_item=" + json.dumps(safe(payload[0]), sort_keys=True))
          PY
